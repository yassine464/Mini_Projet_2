<form>
  <div [hidden]="ajout">
    <label>ID Marque</label>
    <input readonly type="text" [(ngModel)]="marque.idMarque" name="idMarque" class="form-control w-25">
  </div>
  <div>
    <label>Nom Marque</label>
    <input type="text" [(ngModel)]="marque.nomMarque" name="nomMarque" class="form-control"
      placeholder="Entrez un nom de marque...">
  </div>
  <div>
    <label>Description</label>
    <input type="text" [(ngModel)]="marque.descriptionMarque" name="descriptionMarque" class="form-control"
      placeholder="Entrez une description...">
  </div>
  <div class="mt-2">
    <button type="submit" [disabled]="!marque.nomMarque" class="btn btn-success"
      (click)="saveMarque()">{{ajout ? 'Ajouter' : 'Modifier'}}</button>
  </div>
</form>
